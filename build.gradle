plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.blamejared.com' }
        }
        filter { includeGroup 'mezz.jei' }
    }

    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.k-4u.nl' }
        }
        filter { includeGroup 'mcjty.theoneprobe' }
    }
}

dependencies {
    // Compile against integration APIs, and load the complete mods in dev runs.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "mcjty.theoneprobe:theoneprobe:${top_version}"

    // Use -Pexclude_optional_mods to verify that the mod also starts by itself.
    if (!project.hasProperty('exclude_optional_mods')) {
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        runtimeOnly "mcjty.theoneprobe:theoneprobe:${top_version}"
    }
}

sourceSets.main.resources {
    // Include the JSON files created by the data generators.
    srcDir 'src/generated/resources'
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 uses Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // These tasks let us start Minecraft directly from Gradle or an IDE.
    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Replace ${...} placeholders in neoforge.mods.toml with gradle.properties values.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        jei_version            : jei_version
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
